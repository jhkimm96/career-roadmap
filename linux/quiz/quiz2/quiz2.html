<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리눅스마스터 2급 — 전체 문제 361선</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#0d0d14;color:#e8e6f0;min-height:100vh}
a{color:inherit;text-decoration:none}

/* NAV */
.top-nav{background:#161624;border-bottom:1px solid #2a2a4a;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.back-btn{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;text-decoration:none}
.back-btn:hover{border-color:#e94560;color:#e94560}
.nav-title{font-size:15px;font-weight:700;color:#fff}
.nav-badge{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.4);color:#818cf8;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px}
.tab-bar{display:flex;gap:6px;margin-left:auto}
.tab-btn{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;padding:6px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;position:relative}
.tab-btn:hover{border-color:#818cf8;color:#818cf8}
.tab-btn.active{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4);color:#818cf8}
.wrong-badge{position:absolute;top:-6px;right:-6px;background:#e94560;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;min-width:18px;text-align:center}

/* WRAP */
.quiz-wrap{max-width:780px;margin:0 auto;padding:32px 24px 80px}

/* SCORE BAR */
.score-bar{background:#161624;border:1px solid #2a2a4a;border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:24px;margin-bottom:20px;flex-wrap:wrap}
.score-item{text-align:center}
.score-num{font-size:28px;font-weight:900;color:#e94560}
.score-num.ok{color:#34d399}
.score-label{font-size:12px;color:#7775a0;margin-top:2px}
.progress{flex:1;min-width:200px}
.progress-bar{background:#1e1e35;border-radius:8px;height:8px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#6366f1,#818cf8);height:100%;border-radius:8px;transition:width .4s}
.progress-text{font-size:12px;color:#7775a0;margin-top:4px}

/* FILTER */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter-btn{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.filter-btn:hover,.filter-btn.active{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4);color:#818cf8}

/* QUESTION */
.q-card{background:#161624;border:1px solid #2a2a4a;border-radius:16px;padding:24px;margin-bottom:20px;transition:border-color .2s}
.q-card.correct{border-color:#34d399}
.q-card.wrong{border-color:#e94560}
.q-num{font-size:11px;font-family:'JetBrains Mono',monospace;color:#7775a0;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.q-tag{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;font-size:11px;padding:2px 8px;border-radius:6px}
.q-text{font-size:15px;color:#fff;font-weight:500;margin-bottom:20px;line-height:1.6}
.opts{display:grid;gap:8px}
.opt{background:#1e1e35;border:1px solid #3a3a5c;border-radius:10px;padding:12px 16px;cursor:pointer;font-size:14px;color:#e8e6f0;transition:all .15s;display:flex;align-items:center;gap:10px;font-family:inherit;width:100%;text-align:left}
.opt:hover{border-color:#7775a0;background:#252540}
.opt.correct-ans{border-color:#34d399!important;background:rgba(52,211,153,.12)!important;color:#34d399!important}
.opt.wrong-ans{border-color:#e94560!important;background:rgba(233,69,96,.12)!important;color:#e94560!important}
.opt-icon{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.explanation{background:#1a1230;border:1px solid rgba(168,85,247,.3);border-radius:10px;padding:12px 16px;margin-top:12px;display:none}
.explanation.show{display:block}
.exp-title{font-size:11px;color:#a855f7;font-weight:700;margin-bottom:6px}
.exp-text{font-size:13px;color:#ddd6fe;line-height:1.6}

/* NAV BTNS */
.nav-btns{display:flex;gap:10px;margin-top:24px;justify-content:space-between}
.nav-btn{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;padding:10px 20px;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit}
.nav-btn:hover{border-color:#6366f1;color:#818cf8}
.nav-btn.primary{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4);color:#818cf8}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-btn:disabled:hover{border-color:#3a3a5c;color:#9997b8}

/* RESULT */
.result-screen{display:none;text-align:center;padding:40px 20px}
.result-screen.show{display:block}
.result-big{font-size:64px;margin-bottom:12px}
.result-score{font-size:48px;font-weight:900;color:#818cf8;margin-bottom:8px}
.result-msg{font-size:16px;color:#9997b8;margin-bottom:32px}
.result-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.restart-btn{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.4);color:#818cf8;padding:14px 28px;border-radius:12px;font-size:15px;cursor:pointer;font-family:inherit}
.restart-btn:hover{background:rgba(99,102,241,.25)}
.restart-btn.danger{background:rgba(233,69,96,.15);border-color:rgba(233,69,96,.4);color:#e94560}
.restart-btn.danger:hover{background:rgba(233,69,96,.25)}

/* 오답노트 TAB */
.note-wrap{display:none}
.note-wrap.show{display:block}
.note-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.note-title{font-size:20px;font-weight:700;color:#fff}
.note-actions{display:flex;gap:8px}
.note-btn{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.note-btn:hover{border-color:#6366f1;color:#818cf8}
.note-btn.danger{border-color:rgba(233,69,96,.4);color:#e94560;background:rgba(233,69,96,.08)}
.note-btn.danger:hover{background:rgba(233,69,96,.2)}
.note-empty{text-align:center;padding:60px 20px;color:#7775a0;font-size:15px}
.note-card{background:#161624;border:1px solid #2a2a4a;border-radius:14px;padding:20px;margin-bottom:14px}
.note-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.note-card-tag{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;font-size:11px;padding:2px 8px;border-radius:6px}
.note-del-btn{background:none;border:1px solid rgba(233,69,96,.3);color:#e94560;padding:3px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.note-del-btn:hover{background:rgba(233,69,96,.1)}
.note-q{font-size:14px;color:#e8e6f0;line-height:1.6;margin-bottom:12px}
.note-ans{font-size:13px;color:#34d399;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.note-exp{font-size:12px;color:#a78bfa;line-height:1.5}
.practice-btn{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.4);color:#818cf8;padding:12px 24px;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;width:100%;margin-top:20px}
.practice-btn:hover{background:rgba(99,102,241,.25)}
</style>
</head>
<body>
<nav class="top-nav">
  <a href="../../index.html" class="back-btn">← 목록</a>
  <span class="nav-title">리눅스마스터 2급 — 361선</span>
  <span class="nav-badge">전체 기출</span>
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-quiz" onclick="showTab('quiz')">퀴즈</button>
    <button class="tab-btn" id="tab-note" onclick="showTab('note')">
      오답노트
      <span class="wrong-badge" id="note-badge" style="display:none">0</span>
    </button>
  </div>
</nav>

<div class="quiz-wrap">
  <!-- QUIZ TAB -->
  <div id="quiz-tab">
    <div class="score-bar">
      <div class="score-item"><div class="score-num ok" id="correct-count">0</div><div class="score-label">정답</div></div>
      <div class="score-item"><div class="score-num" id="wrong-count" style="color:#7775a0">0</div><div class="score-label">오답</div></div>
      <div class="progress">
        <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
        <div class="progress-text" id="prog-text">0 / 361 문제</div>
      </div>
    </div>

    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" onclick="filterQuiz('all',this)">전체 (361)</button>
      <button class="filter-btn" onclick="filterQuiz('파일시스템',this)">파일시스템</button>
      <button class="filter-btn" onclick="filterQuiz('권한',this)">권한</button>
      <button class="filter-btn" onclick="filterQuiz('셸',this)">셸</button>
      <button class="filter-btn" onclick="filterQuiz('에디터',this)">에디터</button>
      <button class="filter-btn" onclick="filterQuiz('프로세스',this)">프로세스</button>
      <button class="filter-btn" onclick="filterQuiz('패키지',this)">패키지</button>
      <button class="filter-btn" onclick="filterQuiz('장치설정',this)">장치설정</button>
      <button class="filter-btn" onclick="filterQuiz('X윈도',this)">X윈도</button>
      <button class="filter-btn" onclick="filterQuiz('네트워크',this)">네트워크</button>
      <button class="filter-btn" onclick="filterQuiz('응용분야',this)">응용분야</button>
    </div>

    <div id="quiz-container"></div>

    <div id="result-screen" class="result-screen">
      <div class="result-big" id="result-emoji">🎉</div>
      <div class="result-score" id="result-score"></div>
      <div class="result-msg" id="result-msg"></div>
      <div class="result-btns">
        <button class="restart-btn" onclick="restart()">🔄 다시 풀기</button>
        <button class="restart-btn danger" id="retry-wrong-btn" onclick="retryWrong()">❌ 오답만 다시</button>
        <button class="restart-btn" onclick="showTab('note')">📓 오답노트 보기</button>
      </div>
    </div>
  </div>

  <!-- 오답노트 TAB -->
  <div id="note-tab" class="note-wrap">
    <div class="note-header">
      <div class="note-title">📓 오답노트 <span id="note-count" style="font-size:14px;color:#7775a0;font-weight:400"></span></div>
      <div class="note-actions">
        <button class="note-btn" id="practice-wrong-top" onclick="practiceWrong()">오답만 풀기</button>
        <button class="note-btn danger" onclick="clearWrongNote()">전체 삭제</button>
      </div>
    </div>
    <div id="note-list"></div>
  </div>
</div>

<script src="quiz2.js"></script>
<script>
// ─── 오답노트 localStorage ───────────────────────────────────────
const STORE_KEY = 'lm2_wrong_note';

function loadWrongNote() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch { return []; }
}
function saveWrongNote(list) {
  localStorage.setItem(STORE_KEY, JSON.stringify(list));
  updateNoteBadge();
}
function addToWrongNote(q) {
  const list = loadWrongNote();
  const key = q.q;
  if (!list.find(x => x.q === key)) { list.push(q); saveWrongNote(list); }
}
function removeFromWrongNote(key) {
  const list = loadWrongNote().filter(x => x.q !== key);
  saveWrongNote(list);
  renderNoteList();
}
function clearWrongNote() {
  if (!confirm('오답노트를 전부 삭제할까요?')) return;
  saveWrongNote([]);
  renderNoteList();
}
function updateNoteBadge() {
  const n = loadWrongNote().length;
  const badge = document.getElementById('note-badge');
  badge.textContent = n;
  badge.style.display = n > 0 ? 'block' : 'none';
}

// ─── TAB ──────────────────────────────────────────────────────────
function showTab(tab) {
  document.getElementById('tab-quiz').classList.toggle('active', tab === 'quiz');
  document.getElementById('tab-note').classList.toggle('active', tab === 'note');
  document.getElementById('quiz-tab').style.display = tab === 'quiz' ? 'block' : 'none';
  const noteTab = document.getElementById('note-tab');
  noteTab.classList.toggle('show', tab === 'note');
  if (tab === 'note') renderNoteList();
}

// ─── QUIZ STATE ───────────────────────────────────────────────────
let quizData = [...allQuiz];
let sessionWrong = [];
let current = 0, score = 0, wrong = 0, answered = [];

// ─── FILTER ───────────────────────────────────────────────────────
function filterQuiz(tag, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  quizData = tag === 'all' ? [...allQuiz] : allQuiz.filter(q => q.tag === tag);
  restart();
}

// ─── RENDER ───────────────────────────────────────────────────────
function render() {
  const container = document.getElementById('quiz-container');
  if (current >= quizData.length) { showResult(); return; }
  const q = quizData[current];
  const isAnswered = answered[current] !== undefined;
  container.innerHTML = `
    <div class="q-card ${isAnswered ? (answered[current] === q.ans ? 'correct' : 'wrong') : ''}">
      <div class="q-num">
        <span>문제 ${current + 1} / ${quizData.length}</span>
        <span class="q-tag">${q.tag}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="opts">
        ${q.opts.map((o, i) => `
          <button class="opt ${getOptClass(i)}" onclick="${isAnswered ? '' : 'selectAns(' + i + ')'}">
            <span class="opt-icon">${getOptIcon(i, isAnswered, q.ans)}</span>${o}
          </button>`).join('')}
      </div>
      <div class="explanation ${isAnswered ? 'show' : ''}">
        <div class="exp-title">💡 해설</div>
        <div class="exp-text">${q.exp}</div>
      </div>
    </div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="prev()" ${current === 0 ? 'disabled' : ''}>← 이전</button>
      <button class="nav-btn primary" onclick="next()">${current === quizData.length - 1 ? '결과 보기' : '다음 →'}</button>
    </div>
  `;
  updateScore();
}

function getOptClass(i) {
  if (answered[current] === undefined) return '';
  if (i === quizData[current].ans) return 'correct-ans';
  if (i === answered[current]) return 'wrong-ans';
  return '';
}
function getOptIcon(i, isAnswered, ans) {
  if (!isAnswered) return String.fromCharCode(9312 + i);
  if (i === ans) return '✓';
  if (i === answered[current] && answered[current] !== ans) return '✗';
  return String.fromCharCode(9312 + i);
}

function selectAns(i) {
  answered[current] = i;
  const q = quizData[current];
  if (i === q.ans) {
    score++;
  } else {
    wrong++;
    sessionWrong.push(q);
    addToWrongNote(q);
  }
  render();
}

function updateScore() {
  document.getElementById('correct-count').textContent = score;
  document.getElementById('wrong-count').textContent = wrong;
  const done = answered.filter(a => a !== undefined).length;
  document.getElementById('prog-fill').style.width = (done / quizData.length * 100) + '%';
  document.getElementById('prog-text').textContent = done + ' / ' + quizData.length + ' 문제';
}

function next() { if (current < quizData.length - 1) { current++; render(); } else showResult(); }
function prev() { if (current > 0) { current--; render(); } }

function showResult() {
  document.getElementById('quiz-container').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.classList.add('show');
  const pct = Math.round(score / quizData.length * 100);
  document.getElementById('result-emoji').textContent = pct >= 80 ? '🎉' : pct >= 60 ? '😊' : '💪';
  document.getElementById('result-score').textContent = score + ' / ' + quizData.length + ' (' + pct + '%)';
  document.getElementById('result-msg').textContent =
    pct >= 80 ? '합격권! 자신감 갖고 시험 보세요!' :
    pct >= 60 ? '조금만 더 복습하면 합격 가능!' :
    '취약 토픽을 오답노트로 다시 복습해보세요';
  const btn = document.getElementById('retry-wrong-btn');
  btn.style.display = sessionWrong.length > 0 ? 'inline-block' : 'none';
}

function restart() {
  current = 0; score = 0; wrong = 0; answered = []; sessionWrong = [];
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('result-screen').classList.remove('show');
  render();
}

function retryWrong() {
  if (sessionWrong.length === 0) { alert('이번 세션 오답이 없어요!'); return; }
  quizData = [...sessionWrong];
  restart();
}

function practiceWrong() {
  const list = loadWrongNote();
  if (list.length === 0) { alert('오답노트가 비어있어요!'); return; }
  quizData = [...list];
  showTab('quiz');
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  restart();
}

// ─── NOTE LIST ────────────────────────────────────────────────────
function renderNoteList() {
  const list = loadWrongNote();
  const countEl = document.getElementById('note-count');
  countEl.textContent = list.length > 0 ? '(' + list.length + '문제)' : '';
  const practiceBtn = document.getElementById('practice-wrong-top');
  practiceBtn.style.display = list.length > 0 ? 'inline-block' : 'none';
  const container = document.getElementById('note-list');
  if (list.length === 0) {
    container.innerHTML = '<div class="note-empty">오답노트가 비어있어요.<br>틀린 문제가 자동으로 여기에 저장됩니다.</div>';
    return;
  }
  container.innerHTML = list.map((q, idx) => `
    <div class="note-card">
      <div class="note-card-head">
        <span class="note-card-tag">${q.tag}</span>
        <button class="note-del-btn" onclick="removeFromWrongNote(${JSON.stringify(q.q).replace(/"/g,'&quot;')})">삭제</button>
      </div>
      <div class="note-q">${idx + 1}. ${q.q}</div>
      <div class="note-ans">정답: ${q.opts[q.ans]}</div>
      <div class="note-exp">💡 ${q.exp}</div>
    </div>
  `).join('');
}

// ─── INIT ─────────────────────────────────────────────────────────
updateNoteBadge();
render();
</script>
</body>
</html>
