<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기출 퀴즈 100선 — 리눅스마스터 2급</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#0d0d14;color:#e8e6f0;min-height:100vh}
a{color:inherit;text-decoration:none}
.top-nav{background:#161624;border-bottom:1px solid #2a2a4a;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.back-btn{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;text-decoration:none}
.back-btn:hover{border-color:#e94560;color:#e94560}
.nav-title{font-size:15px;font-weight:700;color:#fff}
.nav-badge{background:rgba(233,69,96,0.15);border:1px solid rgba(233,69,96,0.4);color:#e94560;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;margin-left:auto}
.quiz-wrap{max-width:760px;margin:0 auto;padding:32px 24px 80px}
.score-bar{background:#161624;border:1px solid #2a2a4a;border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:24px;margin-bottom:24px;flex-wrap:wrap}
.score-item{text-align:center}
.score-num{font-size:28px;font-weight:900;color:#e94560}
.score-label{font-size:12px;color:#7775a0;margin-top:2px}
.progress{flex:1;min-width:200px}
.progress-bar{background:#1e1e35;border-radius:8px;height:8px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#e94560,#f97316);height:100%;border-radius:8px;transition:width .4s}
.progress-text{font-size:12px;color:#7775a0;margin-top:4px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter-btn{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit}
.filter-btn:hover,.filter-btn.active{background:rgba(233,69,96,.15);border-color:rgba(233,69,96,.4);color:#e94560}
.q-card{background:#161624;border:1px solid #2a2a4a;border-radius:16px;padding:24px;margin-bottom:20px;transition:border-color .2s}
.q-card.correct{border-color:#34d399}
.q-card.wrong{border-color:#e94560}
.q-num{font-size:11px;font-family:'JetBrains Mono',monospace;color:#7775a0;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.q-tag{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;font-size:11px;padding:2px 8px;border-radius:6px}
.q-text{font-size:15px;color:#fff;font-weight:500;margin-bottom:20px;line-height:1.6}
.opts{display:grid;gap:8px}
.opt{background:#1e1e35;border:1px solid #3a3a5c;border-radius:10px;padding:12px 16px;cursor:pointer;font-size:14px;color:#e8e6f0;transition:all .15s;display:flex;align-items:center;gap:10px;font-family:inherit;width:100%;text-align:left}
.opt:hover{border-color:#7775a0;background:#252540}
.opt.correct-ans{border-color:#34d399!important;background:rgba(52,211,153,.12)!important;color:#34d399!important}
.opt.wrong-ans{border-color:#e94560!important;background:rgba(233,69,96,.12)!important;color:#e94560!important}
.opt-icon{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.explanation{background:#1a1230;border:1px solid rgba(168,85,247,.3);border-radius:10px;padding:12px 16px;margin-top:12px;display:none}
.explanation.show{display:block}
.exp-title{font-size:11px;color:#a855f7;font-weight:700;margin-bottom:6px}
.exp-text{font-size:13px;color:#ddd6fe;line-height:1.6}
.nav-btns{display:flex;gap:10px;margin-top:24px;justify-content:space-between}
.nav-btn{background:#1e1e35;border:1px solid #3a3a5c;color:#9997b8;padding:10px 20px;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit}
.nav-btn:hover{border-color:#e94560;color:#e94560}
.nav-btn.primary{background:rgba(233,69,96,.15);border-color:rgba(233,69,96,.4);color:#e94560}
.result-screen{display:none;text-align:center;padding:40px 20px}
.result-screen.show{display:block}
.result-big{font-size:64px;margin-bottom:12px}
.result-score{font-size:48px;font-weight:900;color:#e94560;margin-bottom:8px}
.result-msg{font-size:16px;color:#9997b8;margin-bottom:32px}
.restart-btn{background:rgba(233,69,96,.15);border:1px solid rgba(233,69,96,.4);color:#e94560;padding:14px 32px;border-radius:12px;font-size:16px;cursor:pointer;font-family:inherit;margin:6px}
.restart-btn:hover{background:rgba(233,69,96,.25)}
</style>
</head>
<body>
<nav class="top-nav">
  <a href="../index.html" class="back-btn">← 목록</a>
  <span class="nav-title">🎯 기출 핵심 퀴즈 100선</span>
  <span class="nav-badge">2022~2024 기출</span>
</nav>
<div class="quiz-wrap">
  <div class="score-bar">
    <div class="score-item"><div class="score-num" id="correct-count">0</div><div class="score-label">정답</div></div>
    <div class="score-item"><div class="score-num" id="wrong-count" style="color:#7775a0">0</div><div class="score-label">오답</div></div>
    <div class="progress">
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="progress-text" id="prog-text">0 / 100 문제</div>
    </div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterQuiz('all')">전체</button>
    <button class="filter-btn" onclick="filterQuiz('권한')">권한</button>
    <button class="filter-btn" onclick="filterQuiz('파일시스템')">파일시스템</button>
    <button class="filter-btn" onclick="filterQuiz('셸')">셸</button>
    <button class="filter-btn" onclick="filterQuiz('프로세스')">프로세스</button>
    <button class="filter-btn" onclick="filterQuiz('에디터')">에디터</button>
    <button class="filter-btn" onclick="filterQuiz('패키지')">패키지</button>
    <button class="filter-btn" onclick="filterQuiz('네트워크')">네트워크</button>
    <button class="filter-btn" onclick="filterQuiz('X윈도')">X윈도</button>
    <button class="filter-btn" onclick="filterQuiz('가상화')">가상화</button>
  </div>

  <div id="quiz-container"></div>
  <div id="result-screen" class="result-screen">
    <div class="result-big" id="result-emoji">🎉</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <button class="restart-btn" onclick="restart()">🔄 다시 풀기</button>
    <button class="restart-btn" onclick="restartWrong()">❌ 오답만 다시</button>
  </div>
</div>

<script>
const allQuiz = [
  // ===== 권한 (1~20) =====
  {q:"umask 값이 0022일 때 새로 생성된 파일의 허가권으로 알맞은 것은?",opts:["644","755","666","777"],ans:0,tag:"권한",exp:"파일 기본권한 666 - umask 022 = 644 (rw-r--r--)"},
  {q:"umask 값이 0002일 때 생성된 디렉터리의 허가권으로 알맞은 것은?",opts:["775","755","664","644"],ans:0,tag:"권한",exp:"디렉터리 기본권한 777 - umask 002 = 775 (rwxrwxr-x)"},
  {q:"/project 디렉터리에서 파일 삭제는 본인 파일만 가능하도록 설정하는 명령은?",opts:["chmod g+s /project","chmod g+t /project","chmod o+s /project","chmod o+t /project"],ans:3,tag:"권한",exp:"Sticky Bit(o+t): 파일 삭제 시 소유자만 가능"},
  {q:"/usr/bin/passwd에 설정된 특수권한으로 알맞은 것은?",opts:["Set-GID","Sticky Bit","Set-UID","ACL"],ans:2,tag:"권한",exp:"passwd는 일반사용자도 비밀번호 변경 가능하도록 SetUID 설정"},
  {q:"파일 생성 시 자동으로 그룹 소유권이 디렉터리 그룹으로 설정되게 하려면?",opts:["Sticky Bit","Set-UID","Set-GID","chmod o+t"],ans:2,tag:"권한",exp:"SetGID를 디렉터리에 설정하면 파일 생성 시 그룹 자동 부여"},
  {q:"chmod 3770 /project 에서 3이 의미하는 특수권한 조합은?",opts:["SetUID + SetGID","SetUID + Sticky Bit","SetGID + Sticky Bit","SetUID + SetGID + Sticky Bit"],ans:2,tag:"권한",exp:"Sticky Bit(1) + SetGID(2) = 3"},
  {q:"다음 중 chown 명령어로 lin.txt 소유자=ihduser, 그룹=kait로 변경하는 명령은?",opts:["chown kait:ihduser lin.txt","chown ihduser:kait lin.txt","chgrp ihduser:kait lin.txt","chgrp kait:ihduser lin.txt"],ans:1,tag:"권한",exp:"chown 소유자:그룹 파일명 형식"},
  {q:"chmod a=rx file 명령의 결과로 알맞은 것은?",opts:["rwxrwxrwx","r-xr-xr-x","rw-rw-rw-","rwxr-xr-x"],ans:1,tag:"권한",exp:"a=rx: 모든 사용자(a)에게 읽기(r)와 실행(x)만 설정"},
  {q:"ls -l 출력에서 첫 글자가 'd'인 파일의 유형으로 알맞은 것은?",opts:["일반 파일","디렉터리","심볼릭 링크","블록 파일"],ans:1,tag:"권한",exp:"-=일반파일, d=디렉터리, l=심볼릭링크, b=블록장치"},
  {q:"SetUID의 숫자값으로 알맞은 것은?",opts:["1000","2000","3000","4000"],ans:3,tag:"권한",exp:"SetUID=4000, SetGID=2000, Sticky Bit=1000"},
  {q:"chgrp -h 명령의 역할로 알맞은 것은?",opts:["하위 디렉터리 포함 변경","심볼릭 링크 파일의 그룹 변경","도움말 출력","그룹 목록 확인"],ans:1,tag:"권한",exp:"chgrp -h: 심볼릭 링크 파일의 그룹 소유권 변경"},
  {q:"실행파일에 SetUID 설정 시 표시되는 기호로 알맞은 것은?",opts:["S (대문자)","s (소문자)","t","T"],ans:1,tag:"권한",exp:"실행 가능한 파일에 특수권한 설정 시 소문자(s,t), 실행 불가 시 대문자(S,T)"},
  {q:"파일의 기본 허가권 값으로 알맞은 것은?",opts:["644","755","666","777"],ans:2,tag:"권한",exp:"파일 기본권한=666, 디렉터리 기본권한=777"},
  {q:"chown :root test 명령의 결과로 알맞은 것은?",opts:["소유자를 root로 변경","그룹을 root로 변경","소유자와 그룹 모두 root로 변경","오류 발생"],ans:1,tag:"권한",exp:"chown :그룹명 → 그룹 소유권만 변경"},
  {q:"chmod -R o+w TST 명령의 의미로 알맞은 것은?",opts:["TST 파일에 기타 사용자 쓰기 권한 추가","TST와 하위 모든 파일에 기타 사용자 쓰기 권한 추가","TST 소유자에게 쓰기 권한 제거","TST 그룹에 쓰기 권한 추가"],ans:1,tag:"권한",exp:"-R: 하위 디렉터리 포함, o+w: 기타 사용자 쓰기 추가"},
  {q:"umask -S 옵션의 역할로 알맞은 것은?",opts:["umask를 숫자로 표기","umask 값을 문자로 표기","umask 값 초기화","시스템 umask 설정"],ans:1,tag:"권한",exp:"-S: umask 값을 문자 형식으로 표기"},
  {q:"edquota -p bookmark ihd 명령에서 -p 옵션의 의미는?",opts:["패스워드 설정","다른 사용자와 동일하게 설정","프로토타입 삭제","파티션 지정"],ans:1,tag:"권한",exp:"-p: 디스크 할당량을 다른 사용자(bookmark)와 동일하게 설정"},
  {q:"setquota 명령으로 직접 디스크 사용량 할당 시 사용하는 옵션은?",opts:["-g","-u","-a","-f"],ans:1,tag:"권한",exp:"setquota -u 계정명 [블록soft] [블록hard] [inode soft] [inode hard]"},
  {q:"Sticky Bit는 주로 어디에 사용하는가?",opts:["실행 파일","일반 파일","디렉터리","심볼릭 링크"],ans:2,tag:"권한",exp:"Sticky Bit는 주로 공용 디렉터리(/tmp 등)에 사용"},
  {q:"ls -l /usr/bin/passwd 실행 시 나타나는 특수권한 표시로 알맞은 것은?",opts:["-rwxr-xr-x","-rwsr-xr-x","-rwxr-sr-x","-rwxr-xr-t"],ans:1,tag:"권한",exp:"소유자 실행 권한 자리에 s → SetUID 설정됨"},

  // ===== 파일시스템 (21~35) =====
  {q:"mke2fs -j /dev/sdb1 실행 결과 생성되는 파일시스템은?",opts:["ext2","ext3","ext4","xfs"],ans:1,tag:"파일시스템",exp:"-j 옵션은 저널링 활성화 → 자동으로 ext3 생성"},
  {q:"LVM 구성 순서로 알맞은 것은?",opts:["VG→PV→LV","LV→VG→PV","PV→VG→LV","PE→PV→VG"],ans:2,tag:"파일시스템",exp:"PV(물리볼륨) → VG(볼륨그룹) → LV(논리볼륨)"},
  {q:"/etc/fstab 파일에서 마운트 옵션을 기록하는 필드는?",opts:["2번째","3번째","4번째","5번째"],ans:2,tag:"파일시스템",exp:"1:장치명, 2:마운트포인트, 3:타입, 4:옵션, 5:dump, 6:pass"},
  {q:"XFS 파일시스템 점검 도구로 알맞은 것은?",opts:["fsck","e2fsck","xfs_repair","xfs_check"],ans:2,tag:"파일시스템",exp:"ext계열→fsck/e2fsck, XFS→xfs_repair"},
  {q:"현재 마운트된 파일시스템 정보를 저장하는 파일은?",opts:["/etc/fstab","/etc/mtab","/etc/mounts","/proc/partitions"],ans:1,tag:"파일시스템",exp:"/etc/mtab: 현재 마운트된 파일시스템 정보"},
  {q:"파티션 UUID와 파일시스템 정보를 확인하는 명령어는?",opts:["lsblk","blkid","fdisk -l","df -T"],ans:1,tag:"파일시스템",exp:"blkid: 하드디스크 파티션의 UUID와 파일시스템 정보 확인"},
  {q:"mount -t ext4 /dev/sdb1 /data 에서 -t 옵션의 의미는?",opts:["마운트 해제","파일시스템 유형 지정","옵션 설정","타입 확인"],ans:1,tag:"파일시스템",exp:"-t: 파일시스템 유형(type)을 지정"},
  {q:"블록 장치 정보를 트리 형식으로 보여주는 명령어는?",opts:["blkid","lsblk","fdisk","df"],ans:1,tag:"파일시스템",exp:"lsblk: 블록 장치에 대한 정보를 트리 형식으로 표시"},
  {q:"디렉터리별 디스크 사용량을 확인하는 명령어는?",opts:["df","du","quota","mount"],ans:1,tag:"파일시스템",exp:"du(disk usage): 디렉터리별 사용량 / df: 파티션별 남은 용량"},
  {q:"fdisk 실행 상태에서 파티션 삭제 시 사용하는 명령은?",opts:["d","r","e","x"],ans:0,tag:"파일시스템",exp:"fdisk: d=삭제, n=새파티션, w=저장, q=종료"},
  {q:"저널링 파일시스템으로 틀린 것은?",opts:["ext3","XFS","ReiserFS","ext2"],ans:3,tag:"파일시스템",exp:"ext2는 저널링 없음. 저널링: ext3, ext4, XFS, ReiserFS, JFS"},
  {q:"/etc/fstab 6번째 필드의 역할은?",opts:["마운트 옵션","백업 여부","fsck 검사 순서","파일시스템 타입"],ans:2,tag:"파일시스템",exp:"6번째 pass: fsck 검사 순서(0=안함, 1=루트, 2=나머지)"},
  {q:"원격 윈도우 공유폴더 마운트 시 사용하는 파일시스템 타입은?",opts:["ntfs","cifs","samba","xfs"],ans:1,tag:"파일시스템",exp:"cifs: SMB의 확장, 윈도우 공유 폴더 마운트에 사용"},
  {q:"df -T 옵션의 역할은?",opts:["사람이 읽기 쉬운 단위","파일시스템 유형 확인","0블록 포함 출력","파티션 크기"],ans:1,tag:"파일시스템",exp:"-T: 해당 파티션의 파일시스템 유형(type) 확인"},
  {q:"RAID-5에서 10GB 디스크 4개 사용 시 실제 사용 가능한 용량은?",opts:["10GB","20GB","30GB","40GB"],ans:2,tag:"파일시스템",exp:"RAID-5: (n-1) × 디스크용량 = 3 × 10GB = 30GB"},

  // ===== 셸 (36~50) =====
  {q:"GNU 프로젝트의 일환으로 만들어진 셸로 알맞은 것은?",opts:["ksh","bash","dash","csh"],ans:1,tag:"셸",exp:"bash(Bourne Again Shell)는 GNU 프로젝트. csh=빌 조이, ksh=데이비드 콘"},

  {q:"사용 가능한 셸 목록이 저장된 파일은?",opts:["/etc/passwd","/etc/shells","~/.bashrc","~/.bash_profile"],ans:1,tag:"셸",exp:"/etc/shells: 시스템에서 사용 가능한 셸 목록"},

  // ===== X윈도/가상화 (96~100) =====
  {q:"KDE와 가장 관련 깊은 라이브러리로 알맞은 것은?",opts:["GTK+","Xlib","Qt","XCB"],ans:2,tag:"X윈도",exp:"KDE=Qt(C++), GNOME=GTK+(LGPL/GNU)"},
  {q:"X서버에 IP 기반으로 클라이언트 접근 허가하는 명령은?",opts:["xauth","xset","xhost","xrandr"],ans:2,tag:"X윈도",exp:"xhost: IP 기반 접근 허가/차단 / xauth: MMC 방식 인증"},
  {q:"부팅 시 X윈도 모드로 설정하는 명령으로 알맞은 것은?",opts:["systemctl set-default multi-user.target","systemctl set-default graphical.target","systemctl get-default graphical.target","systemctl get-default multi-user.target"],ans:1,tag:"X윈도",exp:"X윈도=graphical.target / 텍스트=multi-user.target"},
  {q:"CPU 반가상화와 전가상화 모두 지원하는 하이퍼바이저는?",opts:["KVM","VirtualBox","Xen","Docker"],ans:2,tag:"가상화",exp:"Xen: 반가상화+전가상화 모두 지원 / KVM: 전가상화 / VirtualBox: 전가상화"},
  {q:"IaaS 클라우드 서비스의 설명으로 알맞은 것은?",opts:["응용 프로그램 서비스","개발 플랫폼 제공","IT 하드웨어 자원 대여","가상 데스크탑 제공"],ans:2,tag:"가상화",exp:"IaaS: 서버/스토리지 등 IT 하드웨어 자원 대여 / PaaS: 플랫폼 / SaaS: 앱서비스"},
];

let quizData = [...allQuiz];
let current = 0, score = 0, wrong = 0, answered = [];
let wrongList = [];

function filterQuiz(tag) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  quizData = tag === 'all' ? [...allQuiz] : allQuiz.filter(q => q.tag === tag);
  restart();
}

function render() {
  const container = document.getElementById('quiz-container');
  if (current >= quizData.length) { showResult(); return; }
  const q = quizData[current];
  const isAnswered = answered[current] !== undefined;
  container.innerHTML = `
    <div class="q-card ${isAnswered ? (answered[current]===q.ans?'correct':'wrong') : ''}">
      <div class="q-num">
        <span>문제 ${current+1} / ${quizData.length}</span>
        <span class="q-tag">${q.tag}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="opts">
        ${q.opts.map((o,i)=>`
          <button class="opt ${getOptClass(i)}" onclick="${isAnswered?'':`selectAns(${i})`}">
            <span class="opt-icon">${getOptIcon(i,isAnswered,q.ans)}</span>${o}
          </button>
        `).join('')}
      </div>
      <div class="explanation ${isAnswered?'show':''}" id="exp">
        <div class="exp-title">💡 해설</div>
        <div class="exp-text">${q.exp}</div>
      </div>
    </div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="prev()" ${current===0?'disabled':''}>← 이전</button>
      <button class="nav-btn primary" onclick="next()">${current===quizData.length-1?'결과 보기':'다음 →'}</button>
    </div>
  `;
  updateScore();
}

function getOptClass(i) {
  if(answered[current]===undefined) return '';
  if(i===quizData[current].ans) return 'correct-ans';
  if(i===answered[current]) return 'wrong-ans';
  return '';
}

function getOptIcon(i,isAnswered,ans) {
  if(!isAnswered) return String.fromCharCode(9312+i);
  if(i===ans) return '✓';
  if(i===answered[current]&&answered[current]!==ans) return '✗';
  return String.fromCharCode(9312+i);
}

function selectAns(i) {
  answered[current]=i;
  if(i===quizData[current].ans) score++;
  else { wrong++; wrongList.push(quizData[current]); }
  render();
}

function updateScore() {
  document.getElementById('correct-count').textContent=score;
  document.getElementById('wrong-count').textContent=wrong;
  const done=answered.filter(a=>a!==undefined).length;
  document.getElementById('prog-fill').style.width=(done/quizData.length*100)+'%';
  document.getElementById('prog-text').textContent=`${done} / ${quizData.length} 문제`;
}

function next() { if(current<quizData.length-1){current++;render();}else showResult(); }
function prev() { if(current>0){current--;render();} }

function showResult() {
  document.getElementById('quiz-container').style.display='none';
  const rs=document.getElementById('result-screen');
  rs.classList.add('show');
  const pct=Math.round(score/quizData.length*100);
  document.getElementById('result-emoji').textContent=pct>=80?'🎉':pct>=60?'😊':'💪';
  document.getElementById('result-score').textContent=`${score} / ${quizData.length} (${pct}%)`;
  document.getElementById('result-msg').textContent=pct>=80?'합격권! 자신감 갖고 시험 보세요!':pct>=60?'조금만 더 복습하면 합격 가능!':'취약 토픽을 다시 복습해보세요';
}

function restart() {
  current=0;score=0;wrong=0;answered=[];wrongList=[];
  document.getElementById('quiz-container').style.display='block';
  document.getElementById('result-screen').classList.remove('show');
  render();
}

function restartWrong() {
  if(wrongList.length===0){alert('오답이 없어요! 완벽해요 🎉');return;}
  quizData=[...wrongList];
  restart();
}

render();
</script>
</body>
</html>
