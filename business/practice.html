<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>외식 창업의 이해 — 개념 연습</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #2563EB; --blue-light: #DBEAFE; --blue-mid: #93C5FD;
    --green: #16A34A; --green-light: #DCFCE7;
    --red: #DC2626; --red-light: #FEE2E2;
    --amber: #D97706; --amber-light: #FEF3C7;
    --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
    --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-800: #1F2937; --gray-900: #111827;
    --radius: 10px; --radius-sm: 6px;
  }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #F0F4FF; color: var(--gray-900);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 2rem 1rem 4rem;
  }
  .site-header { width: 100%; max-width: 700px; margin-bottom: 2rem; text-align: center; }
  .site-header .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--green); margin-bottom: 6px; }
  .site-header h1 { font-size: 26px; font-weight: 700; color: var(--gray-900); line-height: 1.3; }
  .site-header p { margin-top: 8px; font-size: 14px; color: var(--gray-600); }
  .nav-link { display: inline-block; margin-top: 12px; font-size: 13px; color: var(--blue); text-decoration: none; padding: 6px 14px; border: 1.5px solid var(--blue-mid); border-radius: 20px; }
  .nav-link:hover { background: var(--blue-light); }

  .card { width: 100%; max-width: 700px; background: #fff; border-radius: 16px; padding: 2rem; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.05); }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
  .progress-bar { flex: 1; height: 6px; background: var(--gray-200); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width .35s ease; }
  .progress-label { font-size: 13px; color: var(--gray-400); white-space: nowrap; }
  .score-badge { font-size: 13px; font-weight: 500; color: var(--green); background: var(--green-light); padding: 2px 10px; border-radius: 20px; white-space: nowrap; }

  .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .q-num { font-size: 12px; font-weight: 700; color: var(--green); background: var(--green-light); padding: 2px 10px; border-radius: 20px; }
  .q-slide { font-size: 11px; color: var(--gray-400); background: var(--gray-100); padding: 2px 8px; border-radius: 20px; }
  .q-type-badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; background: #EDE9FE; color: #5B21B6; }

  .q-text { font-size: 16px; font-weight: 500; line-height: 1.7; color: var(--gray-900); margin-bottom: 1.25rem; }

  .options { display: grid; gap: 8px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border: 1.5px solid var(--gray-200);
    border-radius: var(--radius); cursor: pointer; font-size: 14px;
    color: var(--gray-800); background: #fff; text-align: left;
    transition: border-color .15s, background .15s, transform .1s; line-height: 1.5; width: 100%;
  }
  .opt:hover:not(:disabled) { border-color: #6EE7B7; background: var(--green-light); transform: translateY(-1px); }
  .opt .letter {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--gray-100); color: var(--gray-600);
    font-size: 13px; font-weight: 700; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .opt.selected { border-color: var(--green); background: var(--green-light); }
  .opt.selected .letter { background: var(--green); color: #fff; }
  .opt.correct { border-color: var(--green); background: var(--green-light); }
  .opt.correct .letter { background: var(--green); color: #fff; }
  .opt.wrong { border-color: var(--red); background: var(--red-light); }
  .opt.wrong .letter { background: var(--red); color: #fff; }
  .opt:disabled { cursor: default; transform: none; }

  .feedback { margin-top: 1rem; padding: 14px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.7; display: none; }
  .feedback.visible { display: block; }
  .feedback.correct { background: var(--green-light); border-left: 4px solid var(--green); color: #064E3B; }
  .feedback.wrong   { background: var(--red-light);   border-left: 4px solid var(--red);   color: #7F1D1D; }
  .feedback strong { font-weight: 700; display: block; margin-bottom: 4px; }

  .slide-ref { font-size: 11px; color: var(--gray-400); margin-top: 8px; }

  .btn-row { display: flex; gap: 8px; margin-top: 1.25rem; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }
  .btn {
    padding: 9px 20px; border-radius: var(--radius-sm); font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif; font-weight: 500; cursor: pointer;
    border: 1.5px solid var(--gray-200); background: #fff; color: var(--gray-800);
    transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover:not(:disabled) { background: var(--gray-100); border-color: var(--gray-400); transform: translateY(-1px); }
  .btn.primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn.primary:hover:not(:disabled) { background: #15803D; border-color: #15803D; }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }

  .score-screen { text-align: center; padding: 1rem 0; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: var(--green); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
  .score-circle .big   { font-size: 36px; font-weight: 700; color: #fff; line-height: 1; }
  .score-circle .small { font-size: 13px; color: #A7F3D0; margin-top: 2px; }
  .score-screen h2 { font-size: 20px; font-weight: 700; }
  .score-screen > p { font-size: 14px; color: var(--gray-600); margin-top: 4px; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 1.5rem 0; }
  .result-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--gray-50); border-radius: var(--radius-sm); text-align: left; cursor: pointer; transition: background .15s; }
  .result-item:hover { background: var(--green-light); }
  .ri-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .ri-dot.ok { background: var(--green); } .ri-dot.ng { background: var(--red); } .ri-dot.na { background: var(--amber); }
  .ri-label { font-size: 12px; font-weight: 700; color: var(--gray-400); display: block; }
  .ri-text  { font-size: 13px; color: var(--gray-800); line-height: 1.4; }
  .divider { height: 1px; background: var(--gray-200); margin: 1.5rem 0; }

  @media(max-width:480px) { .card{padding:1.25rem} .q-text{font-size:15px} .result-grid{grid-template-columns:1fr} }
</style>
</head>

// ── 셔플 ──────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── 퀴즈 셋 구성 — 보기 순서만 셔플 ─────────────────────────
function buildQuizSet() {
  return ALL_Q.map(raw => {
    const shuffled = shuffle(raw.opts);
    return { ...raw, opts: shuffled, ans: shuffled.indexOf(raw.ansText) };
  });
}

// ── State ─────────────────────────────────────────────────────
let QS       = [];
let cur      = 0;
let answered = [];
let userText = [];

function calcScore() {
  let s = 0;
  QS.forEach((q, i) => { if (answered[i] === q.ans) s += 4; });
  return s;
}

function init() {
  QS       = buildQuizSet();
  cur      = 0;
  answered = new Array(QS.length).fill(null);
  userText = new Array(QS.length).fill('');
  render();
}

// ── Render ────────────────────────────────────────────────────
function render() {
  if (cur >= QS.length) { renderScore(); return; }
  const q          = QS[cur];
  const pct        = ((cur + 1) / QS.length * 100).toFixed(1);
  const isAnswered = answered[cur] !== null;
  const letters    = ['①','②','③','④','⑤'];

  let inputHtml = '<div class="options">';
  q.opts.forEach((o, i) => {
    let cls = 'opt';
    if (isAnswered) {
      if (i === q.ans)           cls += ' correct';
      else if (i === answered[cur]) cls += ' wrong';
    } else {
      if (userText[cur] === String(i)) cls += ' selected';
    }
    inputHtml += `<button class="${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOpt(${i})">
      <span class="letter">${letters[i]}</span>${o}</button>`;
  });
  inputHtml += '</div>';

  let fbClass = '', fbTitle = '', fbBody = '';
  if (isAnswered) {
    const ok = answered[cur] === q.ans;
    fbClass  = ok ? 'correct' : 'wrong';
    fbTitle  = ok ? '정답!' : `오답 — 정답: ${letters[q.ans]} ${q.opts[q.ans]}`;
    fbBody   = q.explain;
  }

  const isFirst = cur === 0;
  const isLast  = cur === QS.length - 1;
  let btnHtml = '';
  btnHtml += `<button class="btn" onclick="goPrev()" ${isFirst ? 'disabled' : ''}>← 이전</button>`;
  btnHtml += '<span class="spacer"></span>';
  if (!isAnswered) {
    const hasSel = userText[cur] !== '';
    btnHtml += `<button class="btn primary" id="chkbtn" onclick="checkChoice()" ${hasSel ? '' : 'disabled'}>확인</button>`;
  }
  if (!isLast) {
    btnHtml += `<button class="btn ${isAnswered ? 'primary' : ''}" onclick="goNext()" ${!isAnswered ? 'disabled' : ''}>다음 →</button>`;
  } else {
    btnHtml += `<button class="btn ${isAnswered ? 'primary' : ''}" onclick="renderScore()" ${!isAnswered ? 'disabled' : ''}>결과 보기</button>`;
  }

  document.getElementById('card').innerHTML = `
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="progress-label">${cur + 1} / ${QS.length}</span>
      <span class="score-badge">${calcScore()}점</span>
    </div>
    <div class="q-meta">
      <span class="q-num">문제 ${cur + 1}</span>
      <span class="q-slide">${q.slide}</span>
      <span class="q-type-badge">객관식 ${q.opts.length}지선다</span>
    </div>
    <p class="q-text">${q.text}</p>
    ${inputHtml}
    <div class="feedback ${fbClass} ${isAnswered ? 'visible' : ''}">
      <strong>${fbTitle}</strong>${fbBody}
    </div>
    <div class="btn-row">${btnHtml}</div>
  `;
}

function selectOpt(i) {
  if (answered[cur] !== null) return;
  userText[cur] = String(i);
  document.querySelectorAll('.opt').forEach((b, idx) => {
    const me = idx === i;
    b.classList.toggle('selected', me);
    b.querySelector('.letter').style.background = me ? 'var(--green)' : '';
    b.querySelector('.letter').style.color      = me ? '#fff' : '';
  });
  const chk = document.getElementById('chkbtn');
  if (chk) chk.removeAttribute('disabled');
}

function checkChoice() {
  const sel = parseInt(userText[cur]);
  if (isNaN(sel)) return;
  answered[cur] = sel;
  render();
}

function goPrev() {
  if (cur > 0) { cur--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

function goNext() {
  if (cur < QS.length - 1) { cur++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

// ── Score Screen ──────────────────────────────────────────────
function renderScore() {
  const maxScore   = QS.length * 4;
  const finalScore = calcScore();
  let correct = 0;
  answered.forEach((a, i) => { if (a === QS[i].ans) correct++; });

  const emoji = correct >= 20 ? '🏆' : correct >= 15 ? '👍' : correct >= 10 ? '💪' : '📚';
  const msg   = correct >= 20 ? '완벽합니다!' : correct >= 15 ? '잘했어요!' : correct >= 10 ? '조금만 더!' : '다시 한번 도전!';

  let resultHtml = '';
  QS.forEach((q, i) => {
    const a  = answered[i];
    const ok = a === q.ans;
    const dotCls = a === null ? 'na' : ok ? 'ok' : 'ng';
    const label  = a === null ? '미응답' : ok ? '정답' : '오답';
    resultHtml += `<div class="result-item" onclick="jumpTo(${i})">
      <div class="ri-dot ${dotCls}"></div>
      <div>
        <span class="ri-label">문제 ${i + 1} · ${label}</span>
        <span class="ri-text">${q.text.slice(0, 28)}${q.text.length > 28 ? '…' : ''}</span>
      </div>
    </div>`;
  });

  document.getElementById('card').innerHTML = `
    <div class="score-screen">
      <div class="score-circle">
        <span class="big">${finalScore}</span>
        <span class="small">/ ${maxScore}점</span>
      </div>
      <h2>${emoji} ${msg}</h2>
      <p>정답 ${correct}문제 / 전체 ${QS.length}문제</p>
      <div class="divider"></div>
      <p style="font-size:13px;color:var(--gray-400);margin-bottom:8px">문제 클릭 시 해당 문제로 이동합니다</p>
      <div class="result-grid">${resultHtml}</div>
      <div class="divider"></div>
      <div class="btn-row" style="justify-content:center;gap:12px">
        <button class="btn primary" onclick="init()">다시 풀기 (보기 새로 섞기)</button>
        <a href="quiz.html" class="btn">← 시험 대비 15문제</a>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function jumpTo(i) {
  cur = i;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>
