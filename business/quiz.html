<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>외식 창업의 이해 — 퀴즈</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #2563EB; --blue-light: #DBEAFE; --blue-mid: #93C5FD;
    --green: #16A34A; --green-light: #DCFCE7;
    --red: #DC2626; --red-light: #FEE2E2;
    --amber: #D97706; --amber-light: #FEF3C7;
    --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
    --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-800: #1F2937; --gray-900: #111827;
    --radius: 10px; --radius-sm: 6px;
  }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #F0F4FF; color: var(--gray-900);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 2rem 1rem 4rem;
  }
  .site-header { width: 100%; max-width: 700px; margin-bottom: 2rem; text-align: center; }
  .site-header .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; }
  .site-header h1 { font-size: 26px; font-weight: 700; color: var(--gray-900); line-height: 1.3; }
  .site-header p { margin-top: 8px; font-size: 14px; color: var(--gray-600); }

  .card { width: 100%; max-width: 700px; background: #fff; border-radius: 16px; padding: 2rem; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.05); }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
  .progress-bar { flex: 1; height: 6px; background: var(--gray-200); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--blue); border-radius: 3px; transition: width .35s ease; }
  .progress-label { font-size: 13px; color: var(--gray-400); white-space: nowrap; }
  .score-badge { font-size: 13px; font-weight: 500; color: var(--blue); background: var(--blue-light); padding: 2px 10px; border-radius: 20px; white-space: nowrap; }

  .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .q-num { font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-light); padding: 2px 10px; border-radius: 20px; }
  .q-variant { font-size: 11px; color: var(--amber); background: var(--amber-light); padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .q-type-badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
  .badge-choice { background: #EDE9FE; color: #5B21B6; }
  .badge-subj   { background: #D1FAE5; color: #065F46; }

  .q-text { font-size: 16px; font-weight: 500; line-height: 1.7; color: var(--gray-900); margin-bottom: 1.25rem; white-space: pre-wrap; }

  .options { display: grid; gap: 8px; }

  .opt {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border: 1.5px solid var(--gray-200);
    border-radius: var(--radius); cursor: pointer; font-size: 14px;
    color: var(--gray-800); background: #fff; text-align: left;
    transition: border-color .15s, background .15s, transform .1s; line-height: 1.5; width: 100%;
  }
  .opt:hover:not(:disabled) { border-color: var(--blue-mid); background: var(--blue-light); transform: translateY(-1px); }
  .opt .letter {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--gray-100); color: var(--gray-600);
    font-size: 13px; font-weight: 700; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .opt.selected { border-color: var(--blue); background: var(--blue-light); }
  .opt.selected .letter { background: var(--blue); color: #fff; }
  .opt.correct { border-color: var(--green); background: var(--green-light); }
  .opt.correct .letter { background: var(--green); color: #fff; }
  .opt.wrong   { border-color: var(--red); background: var(--red-light); }
  .opt.wrong .letter   { background: var(--red); color: #fff; }
  .opt:disabled { cursor: default; transform: none; }

  .subj-wrap { margin-top: 4px; }
  textarea {
    width: 100%; border: 1.5px solid var(--gray-200); border-radius: var(--radius);
    padding: 12px 16px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
    resize: vertical; min-height: 80px; color: var(--gray-900);
    background: var(--gray-50); transition: border-color .15s;
  }
  textarea:focus { outline: none; border-color: var(--blue); background: #fff; }
  textarea:disabled { opacity: .7; }

  .feedback { margin-top: 1rem; padding: 14px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.7; display: none; }
  .feedback.visible { display: block; }
  .feedback.correct { background: var(--green-light); border-left: 4px solid var(--green); color: #064E3B; }
  .feedback.wrong   { background: var(--red-light);   border-left: 4px solid var(--red);   color: #7F1D1D; }
  .feedback.info    { background: var(--blue-light);  border-left: 4px solid var(--blue);  color: #1E3A8A; }
  .feedback strong { font-weight: 700; display: block; margin-bottom: 4px; }

  .hint-box { margin-top: 10px; padding: 12px 14px; background: var(--amber-light); border-left: 4px solid var(--amber); border-radius: var(--radius-sm); font-size: 13px; color: #78350F; line-height: 1.6; display: none; }
  .hint-box.visible { display: block; }

  .slide-ref { font-size: 11px; color: var(--gray-400); margin-top: 8px; }

  .btn-row { display: flex; gap: 8px; margin-top: 1.25rem; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }
  .btn {
    padding: 9px 20px; border-radius: var(--radius-sm); font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif; font-weight: 500; cursor: pointer;
    border: 1.5px solid var(--gray-200); background: #fff; color: var(--gray-800);
    transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover:not(:disabled) { background: var(--gray-100); border-color: var(--gray-400); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.primary:hover:not(:disabled) { background: #1D4ED8; border-color: #1D4ED8; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--gray-600); }
  .btn.ghost:hover:not(:disabled) { background: var(--gray-100); }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }

  .score-screen { text-align: center; padding: 1rem 0; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: var(--blue); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
  .score-circle .big   { font-size: 36px; font-weight: 700; color: #fff; line-height: 1; }
  .score-circle .small { font-size: 13px; color: var(--blue-mid); margin-top: 2px; }
  .score-screen h2 { font-size: 20px; font-weight: 700; }
  .score-screen > p  { font-size: 14px; color: var(--gray-600); margin-top: 4px; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 1.5rem 0; }
  .result-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--gray-50); border-radius: var(--radius-sm); text-align: left; cursor: pointer; transition: background .15s; }
  .result-item:hover { background: var(--blue-light); }
  .ri-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .ri-dot.ok { background: var(--green); } .ri-dot.ng { background: var(--red); } .ri-dot.na { background: var(--amber); }
  .ri-label { font-size: 12px; font-weight: 700; color: var(--gray-400); display: block; }
  .ri-text  { font-size: 13px; color: var(--gray-800); line-height: 1.4; }
  .divider { height: 1px; background: var(--gray-200); margin: 1.5rem 0; }

  @media(max-width:480px) { .card{padding:1.25rem} .q-text{font-size:15px} .result-grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<header class="site-header">
  <div class="eyebrow">호원대학교 · 외식산업 창업과 경영</div>
  <h1>외식 창업의 이해</h1>
  <p id="subtitle">문제를 불러오는 중...</p>
</header>

<div class="card" id="card"></div>

<script>
// ──────────────────────────────────────────────────────────────

const ALL_Q = [

  },
  {

  {

    text:'창업의 형태는 신규창업, (    ), 프랜차이즈로 나눌 수 있다.',

  // 13번 주관식
  {
    id:'q13', n:13, type:'subjective', slide:'수업 필기',

  },
  // 14번 주관식
  {
    id:'q14', n:14, type:'subjective', slide:'슬라이드 13',
    text:'창업의 성공요인 중 좋은 재료를 안정적으로 들여오는 능력에 해당되는 것은?',
    ans:'구매력',

  {

    explain:'슬라이드 4·15 참조. 준비요소: 시장조사, 법·절차, 자금·인력·공급망 계획 수립 필수. 괄호 = 공급망 계획.'

// ──────────────────────────────────────────────────────────────
// 보기 섞기 유틸
// opts 배열을 셔플하고, 정답 텍스트(ansText)의 새 인덱스를 반환
// ──────────────────────────────────────────────────────────────
function shuffleOpts(opts, ansText) {
  const shuffled = [...opts];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const ansIdx = shuffled.indexOf(ansText);
  return { shuffled, ansIdx };
}

// ──────────────────────────────────────────────────────────────
// 퀴즈 셋 구성
// 변형 있는 문제: 랜덤 1개 선택
// 객관식: 보기를 섞고 정답 인덱스를 계산
// ──────────────────────────────────────────────────────────────
function buildQuizSet() {
  // 그룹핑
  const groups = {};
  ALL_Q.forEach(q => {
    const key = q.variantOf || q.n;
    if (!groups[key]) groups[key] = [];
    groups[key].push(q);
  });

  const keys = Object.keys(groups).map(Number).sort((a, b) => a - b);
  return keys.map(k => {
    const g = groups[k];
    // 랜덤 변형 선택
    const raw = g[Math.floor(Math.random() * g.length)];
    if (raw.type === 'subjective') return { ...raw };

    // 보기 셔플
    const { shuffled, ansIdx } = shuffleOpts(raw.opts, raw.ansText);
    return { ...raw, opts: shuffled, ans: ansIdx };
  });
}

// ──────────────────────────────────────────────────────────────
// State
// ──────────────────────────────────────────────────────────────
let QS        = [];
let cur       = 0;
let answered  = [];   // null | number | 'correct'
let userText  = [];
let hintShown = [];

function calcScore() {
  let s = 0;
  QS.forEach((q, i) => {
    const a = answered[i];
    if (a === null) return;
    if (q.type === 'subjective' && a === 'correct') s += 6;
    if (q.type === 'choice' && a === q.ans) s += 6;
  });
  return s;
}

function init() {
  QS        = buildQuizSet();
  cur       = 0;
  answered  = new Array(QS.length).fill(null);
  userText  = new Array(QS.length).fill('');
  hintShown = new Array(QS.length).fill(false);
  document.getElementById('subtitle').textContent =
    `총 ${QS.length}문제 · 객관식 + 주관식 · 문제당 6점 · 매 시작마다 보기 순서가 랜덤으로 바뀝니다`;
  render();
}

// ──────────────────────────────────────────────────────────────
// Render
// ──────────────────────────────────────────────────────────────
function render() {
  if (cur >= QS.length) { renderScore(); return; }
  const q          = QS[cur];
  const pct        = ((cur + 1) / QS.length * 100).toFixed(1);
  const isAnswered = answered[cur] !== null;
  const isVariant  = !!q.variantOf;
  const letters    = ['①','②','③','④','⑤'];

  // ── 보기 / 입력 ──
  let inputHtml = '';
  if (q.type === 'choice') {
    inputHtml = '<div class="options">';
    q.opts.forEach((o, i) => {
      let cls = 'opt';
      if (isAnswered) {
        if (i === q.ans)                              cls += ' correct';
        else if (i === answered[cur])                 cls += ' wrong';
      } else {
        if (userText[cur] === String(i))              cls += ' selected';
      }
      inputHtml += `<button class="${cls}" ${isAnswered ? 'disabled' : ''} onclick="selectOpt(${i})">
        <span class="letter">${letters[i]}</span>${o}</button>`;
    });
    inputHtml += '</div>';
  } else {
    inputHtml = `<div class="subj-wrap">
      <textarea id="subj" placeholder="답을 입력하세요..." ${isAnswered ? 'disabled' : ''}
        oninput="userText[cur]=this.value">${userText[cur]}</textarea>
    </div>`;
  }

  // ── 피드백 ──
  let fbClass = '', fbTitle = '', fbBody = '';
  if (isAnswered) {
    if (q.type === 'subjective') {
      fbClass = 'info';
      fbTitle = `모범 답안: ${q.ans}`;
      fbBody  = q.explain;
    } else {
      const ok = answered[cur] === q.ans;
      fbClass  = ok ? 'correct' : 'wrong';
      fbTitle  = ok ? '정답!' : `오답 — 정답: ${letters[q.ans]} ${q.opts[q.ans]}`;
      fbBody   = q.explain;
    }
  }

  // ── 버튼 ──
  const isFirst = cur === 0;
  const isLast  = cur === QS.length - 1;
  let btnHtml = '';

  btnHtml += `<button class="btn" onclick="goPrev()" ${isFirst ? 'disabled' : ''}>← 이전</button>`;
  btnHtml += '<span class="spacer"></span>';

  if (!isAnswered) {
    if (q.type === 'choice') {
      const hasSel = userText[cur] !== '';
      btnHtml += `<button class="btn primary" id="chkbtn" onclick="checkChoice()" ${hasSel ? '' : 'disabled'}>확인</button>`;
    } else {
      btnHtml += `<button class="btn primary" onclick="checkSubj()">제출</button>`;
      if (q.hint) {
        btnHtml += `<button class="btn ghost" onclick="toggleHint()">힌트 ${hintShown[cur] ? '숨기기' : '보기'}</button>`;
      }
    }
  }

  if (!isLast) {
    btnHtml += `<button class="btn ${isAnswered ? 'primary' : ''}" onclick="goNext()" ${!isAnswered ? 'disabled' : ''}>다음 →</button>`;
  } else {
    btnHtml += `<button class="btn ${isAnswered ? 'primary' : ''}" onclick="renderScore()" ${!isAnswered ? 'disabled' : ''}>결과 보기</button>`;
  }

  const typeBadge = q.type === 'choice'
    ? `<span class="q-type-badge badge-choice">객관식 ${q.opts.length}지선다</span>`
    : `<span class="q-type-badge badge-subj">주관식</span>`;

  document.getElementById('card').innerHTML = `
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="progress-label">${cur + 1} / ${QS.length}</span>
      <span class="score-badge">${calcScore()}점</span>
    </div>

    <div class="q-meta">
      <span class="q-num">문제 ${q.n}</span>
      ${isVariant ? '<span class="q-variant">변형 보기</span>' : ''}
      ${typeBadge}
    </div>

    <p class="q-text">${q.text}</p>
    ${inputHtml}

    ${q.hint ? `<div class="hint-box ${hintShown[cur] ? 'visible' : ''}" id="hint-box">💡 힌트: ${q.hint}</div>` : ''}

    <div class="feedback ${fbClass} ${isAnswered ? 'visible' : ''}">
      <strong>${fbTitle}</strong>${fbBody}
    </div>

    <p class="slide-ref">참고: ${q.slide}</p>
    <div class="btn-row">${btnHtml}</div>
  `;
}

// ──────────────────────────────────────────────────────────────
// Actions
// ──────────────────────────────────────────────────────────────
function selectOpt(i) {
  if (answered[cur] !== null) return;
  userText[cur] = String(i);
  document.querySelectorAll('.opt').forEach((b, idx) => {
    const me = idx === i;
    b.classList.toggle('selected', me);
    b.querySelector('.letter').style.background = me ? 'var(--blue)' : '';
    b.querySelector('.letter').style.color      = me ? '#fff'        : '';
  });
  const chk = document.getElementById('chkbtn');
  if (chk) chk.removeAttribute('disabled');
}

function checkChoice() {
  const sel = parseInt(userText[cur]);
  if (isNaN(sel)) return;
  answered[cur] = sel;
  render();
}

function checkSubj() {
  const val = (document.getElementById('subj')?.value || '').trim();
  if (!val) return;
  userText[cur]  = val;
  answered[cur]  = 'correct';
  render();
}

function toggleHint() {
  hintShown[cur] = !hintShown[cur];
  const box = document.getElementById('hint-box');
  if (box) box.classList.toggle('visible', hintShown[cur]);
  document.querySelectorAll('.btn.ghost').forEach(b => {
    if (b.textContent.includes('힌트'))
      b.textContent = `힌트 ${hintShown[cur] ? '숨기기' : '보기'}`;
  });
}

function goPrev() {
  if (cur > 0) { cur--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

function goNext() {
  if (cur < QS.length - 1) { cur++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

// ──────────────────────────────────────────────────────────────
// Score Screen
// ──────────────────────────────────────────────────────────────
function renderScore() {
  const maxScore   = QS.length * 6;
  const finalScore = calcScore();
  let correct = 0;
  QS.forEach((q, i) => {
    const a = answered[i];
    if (q.type === 'subjective' && a === 'correct') correct++;
    if (q.type === 'choice' && a === q.ans)         correct++;
  });

  const emoji = correct >= 13 ? '🏆' : correct >= 10 ? '👍' : correct >= 7 ? '💪' : '📚';
  const msg   = correct >= 13 ? '완벽합니다!' : correct >= 10 ? '잘했어요!' : correct >= 7 ? '조금만 더!' : '다시 한번 도전!';

  let resultHtml = '';
  QS.forEach((q, i) => {
    const a  = answered[i];
    const ok = q.type === 'subjective' ? a === 'correct' : (a !== null && a === q.ans);
    const dotCls = a === null ? 'na' : ok ? 'ok' : 'ng';
    const label  = a === null ? '미응답' : ok ? '정답' : '오답';
    resultHtml += `<div class="result-item" onclick="jumpTo(${i})">
      <div class="ri-dot ${dotCls}"></div>
      <div>
        <span class="ri-label">문제 ${q.n}${q.variantOf ? ' (변형)' : ''} · ${label}</span>
        <span class="ri-text">${q.text.split('\n')[0].slice(0, 28)}${q.text.split('\n')[0].length > 28 ? '…' : ''}</span>
      </div>
    </div>`;
  });

  document.getElementById('card').innerHTML = `
    <div class="score-screen">
      <div class="score-circle">
        <span class="big">${finalScore}</span>
        <span class="small">/ ${maxScore}점</span>
      </div>
      <h2>${emoji} ${msg}</h2>
      <p>정답 ${correct}문제 / 전체 ${QS.length}문제</p>
      <div class="divider"></div>
      <p style="font-size:13px;color:var(--gray-400);margin-bottom:8px">문제 클릭 시 해당 문제로 이동합니다</p>
      <div class="result-grid">${resultHtml}</div>
      <div class="divider"></div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn primary" onclick="init()">다시 풀기 (보기 새로 섞기)</button>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function jumpTo(i) {
  cur = i;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ──────────────────────────────────────────────────────────────
init();
</script>
