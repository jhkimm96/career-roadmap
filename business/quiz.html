<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>외식 창업의 이해 — 퀴즈</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #2563EB;
    --blue-light: #DBEAFE;
    --blue-mid: #93C5FD;
    --green: #16A34A;
    --green-light: #DCFCE7;
    --red: #DC2626;
    --red-light: #FEE2E2;
    --amber: #D97706;
    --amber-light: #FEF3C7;
    --gray-50: #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-400: #9CA3AF;
    --gray-600: #4B5563;
    --gray-800: #1F2937;
    --gray-900: #111827;
    --radius: 10px;
    --radius-sm: 6px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #F0F4FF;
    color: var(--gray-900);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  /* ── Header ── */
  .site-header {
    width: 100%;
    max-width: 680px;
    margin-bottom: 2rem;
    text-align: center;
  }
  .site-header .eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 6px;
  }
  .site-header h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--gray-900);
    line-height: 1.3;
  }
  .site-header p {
    margin-top: 8px;
    font-size: 14px;
    color: var(--gray-600);
  }

  /* ── Card ── */
  .card {
    width: 100%;
    max-width: 680px;
    background: #fff;
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.05);
  }

  /* ── Progress ── */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--gray-200);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 3px;
    transition: width 0.35s ease;
  }
  .progress-label {
    font-size: 13px;
    color: var(--gray-400);
    white-space: nowrap;
  }
  .score-badge {
    font-size: 13px;
    font-weight: 500;
    color: var(--blue);
    background: var(--blue-light);
    padding: 2px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ── Question ── */
  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .q-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--blue);
    background: var(--blue-light);
    padding: 2px 10px;
    border-radius: 20px;
  }
  .q-type-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .badge-choice { background: #EDE9FE; color: #5B21B6; }
  .badge-subj   { background: #D1FAE5; color: #065F46; }

  .q-text {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.7;
    color: var(--gray-900);
    margin-bottom: 1.25rem;
    white-space: pre-wrap;
  }

  /* ── Options ── */
  .options { display: grid; gap: 8px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    color: var(--gray-800);
    background: #fff;
    text-align: left;
    transition: border-color .15s, background .15s, transform .1s;
    line-height: 1.5;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--blue-mid);
    background: var(--blue-light);
    transform: translateY(-1px);
  }
  .opt .letter {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--gray-100);
    color: var(--gray-600);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .opt.selected { border-color: var(--blue); background: var(--blue-light); }
  .opt.selected .letter { background: var(--blue); color: #fff; }
  .opt.correct { border-color: var(--green); background: var(--green-light); }
  .opt.correct .letter { background: var(--green); color: #fff; }
  .opt.wrong { border-color: var(--red); background: var(--red-light); }
  .opt.wrong .letter { background: var(--red); color: #fff; }
  .opt:disabled { cursor: default; transform: none; }

  /* ── Textarea ── */
  .subj-wrap { margin-top: 4px; }
  textarea {
    width: 100%;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    resize: vertical;
    min-height: 80px;
    color: var(--gray-900);
    background: var(--gray-50);
    transition: border-color .15s;
  }
  textarea:focus { outline: none; border-color: var(--blue); background: #fff; }

  /* ── Feedback ── */
  .feedback {
    margin-top: 1rem;
    padding: 14px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.7;
    display: none;
  }
  .feedback.visible { display: block; }
  .feedback.correct { background: var(--green-light); border-left: 4px solid var(--green); color: #064E3B; }
  .feedback.wrong   { background: var(--red-light);   border-left: 4px solid var(--red);   color: #7F1D1D; }
  .feedback.info    { background: var(--blue-light);  border-left: 4px solid var(--blue);  color: #1E3A8A; }
  .feedback strong { font-weight: 700; display: block; margin-bottom: 4px; }

  /* ── Buttons ── */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 1.25rem;
    flex-wrap: wrap;
  }
  .btn {
    padding: 9px 20px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid var(--gray-200);
    background: #fff;
    color: var(--gray-800);
    transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover { background: var(--gray-100); border-color: var(--gray-400); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.primary:hover { background: #1D4ED8; border-color: #1D4ED8; }
  .btn.primary:disabled { opacity: 0.4; cursor: default; transform: none; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--gray-600); }
  .btn.ghost:hover { background: var(--gray-100); }

  /* ── Score screen ── */
  .score-screen { text-align: center; padding: 1rem 0; }
  .score-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: var(--blue);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
  }
  .score-circle .big { font-size: 36px; font-weight: 700; color: #fff; line-height: 1; }
  .score-circle .small { font-size: 13px; color: var(--blue-mid); margin-top: 2px; }
  .score-screen h2 { font-size: 20px; font-weight: 700; color: var(--gray-900); }
  .score-screen p { font-size: 14px; color: var(--gray-600); margin-top: 4px; }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 1.5rem 0;
  }
  @media(max-width:420px){ .result-grid { grid-template-columns: 1fr; } }

  .result-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: var(--gray-50);
    border-radius: var(--radius-sm);
    text-align: left;
  }
  .ri-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
  }
  .ri-dot.ok { background: var(--green); }
  .ri-dot.ng { background: var(--red); }
  .ri-dot.na { background: var(--amber); }
  .ri-label { font-size: 12px; font-weight: 700; color: var(--gray-400); display: block; }
  .ri-text  { font-size: 13px; color: var(--gray-800); line-height: 1.4; }

  .divider {
    height: 1px;
    background: var(--gray-200);
    margin: 1.5rem 0;
  }

  /* ── Hint ── */
  .hint-box {
    margin-top: 10px;
    padding: 12px 14px;
    background: var(--amber-light);
    border-left: 4px solid var(--amber);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: #78350F;
    line-height: 1.6;
    display: none;
  }
  .hint-box.visible { display: block; }

  /* ── Slide note ── */
  .slide-ref {
    font-size: 11px;
    color: var(--gray-400);
    margin-top: 6px;
  }

  @media(max-width:480px){
    .card { padding: 1.25rem; }
    .q-text { font-size: 15px; }
  }
</style>
</head>
<body>

</header>

<div class="card" id="card">

    ans: '공급망 계획',
    hint: '슬라이드 4 준비요소 및 슬라이드 15 마무리 체크포인트 — 식재료 구매·공급 관련 계획을 의미합니다.',
    explain: '"창업의 개념" 준비요소: 시장조사, 법·절차, 자금·인력·공급망 계획 수립이 필수. 괄호 = 공급망 계획.'
  }
];

// ── State ────────────────────────────────────────────
let cur = 0;
let score = 0;
let answered = new Array(Q.length).fill(null);  // null | choice_idx | 'correct' | 'wrong'
let userText  = new Array(Q.length).fill('');
let hintShown = new Array(Q.length).fill(false);

// ── Render ───────────────────────────────────────────
function render() {
  if (cur >= Q.length) { renderScore(); return; }
  const q = Q[cur];
  const pct = ((cur + 1) / Q.length * 100).toFixed(1);
  const isAnswered = answered[cur] !== null;

  const letters = ['①','②','③','④'];

  let optsHtml = '';
  if (q.type === 'choice') {
    optsHtml = '<div class="options">';
    q.opts.forEach((o, i) => {
      let cls = 'opt';
      if (isAnswered) {
        if (i === q.ans) cls += ' correct';
        else if (i === answered[cur] && answered[cur] !== q.ans) cls += ' wrong';
      } else {
        if (userText[cur] === String(i)) cls += ' selected';
      }
      const disabled = isAnswered ? 'disabled' : '';
      optsHtml += `<button class="${cls}" ${disabled} onclick="selectOpt(${i})">`
        + `<span class="letter">${letters[i]}</span>${o}</button>`;
    });
    optsHtml += '</div>';
  } else {
    optsHtml = `<div class="subj-wrap">
      <textarea id="subj" placeholder="답을 입력하세요..." ${isAnswered ? 'disabled' : ''}
        oninput="userText[cur]=this.value">${userText[cur]}</textarea>
    </div>`;
  }

  // feedback
  let fbClass = '', fbTitle = '', fbBody = '';
  if (isAnswered) {
    const isCorrect = (q.type === 'choice')
      ? answered[cur] === q.ans
      : answered[cur] === 'correct';
    if (q.type === 'subjective') {
      fbClass = 'info';
      fbTitle = `모범 답안: ${q.ans}`;
      fbBody  = q.explain;
    } else if (isCorrect) {
      fbClass = 'correct';
      fbTitle = '정답!';
      fbBody  = q.explain;
    } else {
      fbClass = 'wrong';
      fbTitle = `오답 — 정답: ${letters[q.ans]} ${q.opts[q.ans]}`;
      fbBody  = q.explain;
    }
  }

  // buttons
  let btnHtml = '';
  if (!isAnswered) {
    if (q.type === 'choice') {
      const hasSelection = userText[cur] !== '';
      btnHtml += `<button class="btn primary" id="chkbtn" onclick="checkChoice()" ${hasSelection ? '' : 'disabled'}>확인</button>`;
    } else {
      btnHtml += `<button class="btn primary" onclick="checkSubj()">제출</button>`;
      if (q.hint) {
        btnHtml += `<button class="btn ghost" onclick="toggleHint()">힌트 ${hintShown[cur] ? '숨기기' : '보기'}</button>`;
      }
    }
  }
  if (cur < Q.length - 1) {
    btnHtml += `<button class="btn" onclick="goNext()" ${!isAnswered ? 'style="opacity:.4;pointer-events:none"' : ''}>다음 →</button>`;
  } else {
    btnHtml += `<button class="btn primary" onclick="renderScore()" ${!isAnswered ? 'style="opacity:.4;pointer-events:none"' : ''}>결과 보기</button>`;
  }

  document.getElementById('card').innerHTML = `
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="progress-label">${cur + 1} / ${Q.length}</span>
      <span class="score-badge">${score}점</span>
    </div>

    <div class="q-meta">
      <span class="q-num">문제 ${q.n}</span>
      <span class="q-type-badge ${q.type === 'choice' ? 'badge-choice' : 'badge-subj'}">
        ${q.type === 'choice' ? '객관식 4지선다' : '주관식'}
      </span>
    </div>

    <p class="q-text">${q.text}</p>

    ${optsHtml}

    ${q.hint ? `<div class="hint-box ${hintShown[cur] ? 'visible' : ''}" id="hint-box">💡 힌트: ${q.hint}</div>` : ''}

    <div class="feedback ${fbClass} ${isAnswered ? 'visible' : ''}" id="fb">
      <strong>${fbTitle}</strong>${fbBody}
    </div>

    <p class="slide-ref">참고: ${q.slide}</p>

    <div class="btn-row">${btnHtml}</div>
  `;
}

function selectOpt(i) {
  if (answered[cur] !== null) return;
  userText[cur] = String(i);
  // highlight selection without re-rendering
  document.querySelectorAll('.opt').forEach((b, idx) => {
    b.classList.toggle('selected', idx === i);
    b.querySelector('.letter').style.background = idx === i ? 'var(--blue)' : '';
    b.querySelector('.letter').style.color = idx === i ? '#fff' : '';
  });
  const chk = document.getElementById('chkbtn');
  if (chk) chk.removeAttribute('disabled');
}

function checkChoice() {
  const q = Q[cur];
  const sel = parseInt(userText[cur]);
  if (isNaN(sel)) return;
  const correct = sel === q.ans;
  if (correct) score += 6;
  answered[cur] = sel;
  render();
}

function checkSubj() {
  const val = (document.getElementById('subj')?.value || '').trim();
  if (!val) return;
  userText[cur] = val;
  score += 6;
  answered[cur] = 'correct';
  render();
}

function toggleHint() {
  hintShown[cur] = !hintShown[cur];
  const box = document.getElementById('hint-box');
  if (box) box.classList.toggle('visible', hintShown[cur]);
  // update button label
  const btns = document.querySelectorAll('.btn.ghost');
  btns.forEach(b => {
    if (b.textContent.includes('힌트')) b.textContent = `힌트 ${hintShown[cur] ? '숨기기' : '보기'}`;
  });
}

function goNext() {
  if (cur < Q.length - 1) { cur++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}

// ── Score Screen ──────────────────────────────────────
function renderScore() {
  const maxScore = Q.length * 6;
  let correct = 0;
  answered.forEach((a, i) => {
    const q = Q[i];
    if (q.type === 'choice' && a === q.ans) correct++;
    else if (q.type === 'subjective' && a === 'correct') correct++;
  });

  let emoji = correct >= 13 ? '🏆' : correct >= 10 ? '👍' : correct >= 7 ? '💪' : '📚';
  let msg   = correct >= 13 ? '완벽합니다!' : correct >= 10 ? '잘했어요!' : correct >= 7 ? '조금만 더!' : '다시 한번 도전!';

  let resultHtml = '';
  Q.forEach((q, i) => {
    const a = answered[i];
    let ok = (q.type === 'choice') ? a === q.ans : a === 'correct';
    let dotCls = a === null ? 'na' : ok ? 'ok' : 'ng';
    let statusLabel = a === null ? '미응답' : ok ? '정답' : '오답';
    resultHtml += `
      <div class="result-item">
        <div class="ri-dot ${dotCls}"></div>
        <div>
          <span class="ri-label">문제 ${q.n} · ${statusLabel}</span>
          <span class="ri-text">${q.text.split('\n')[0].slice(0, 28)}${q.text.length > 28 ? '…' : ''}</span>
        </div>
      </div>`;
  });

  document.getElementById('card').innerHTML = `
    <div class="score-screen">
      <div class="score-circle">
        <span class="big">${score}</span>
        <span class="small">/ ${maxScore}점</span>
      </div>
      <h2>${emoji} ${msg}</h2>
      <p>정답 ${correct}문제 / 전체 ${Q.length}문제</p>

      <div class="divider"></div>
      <div class="result-grid">${resultHtml}</div>
      <div class="divider"></div>

      <div class="btn-row" style="justify-content:center">
        <button class="btn primary" onclick="restart()">처음부터 다시 풀기</button>
        <button class="btn" onclick="reviewWrong()">오답만 다시 풀기</button>
      </div>
    </div>
  `;
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart() {
  cur = 0; score = 0;
  answered = new Array(Q.length).fill(null);
  userText  = new Array(Q.length).fill('');
  hintShown = new Array(Q.length).fill(false);
  render();
}

function reviewWrong() {
  const wrongIdx = [];
  answered.forEach((a, i) => {
    const q = Q[i];
    const ok = (q.type === 'choice') ? a === q.ans : a === 'correct';
    if (!ok) wrongIdx.push(i);
  });
  if (wrongIdx.length === 0) { alert('모두 정답입니다! 🎉'); return; }
  // rebuild Q list to only wrongs, reset state
  const wrongQ = wrongIdx.map(i => Q[i]);
  // Simple approach: jump to first wrong question
  cur = wrongIdx[0];
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}

// ── Init ─────────────────────────────────────────────
render();
</script>
</body>
</html>
